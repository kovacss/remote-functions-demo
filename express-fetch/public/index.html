<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Express Fetch Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }

    #app {
      max-width: 520px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.25rem;
      color: #fff;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .subtitle code {
      background: #2a2a4a;
      padding: 0.15em 0.4em;
      border-radius: 3px;
      font-size: 0.85em;
      color: #a78bfa;
    }

    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #fff;
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #a78bfa;
    }

    button[type="submit"] {
      padding: 0.6rem 1.2rem;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button[type="submit"]:hover { background: #6d28d9; }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.8rem;
      background: #16213e;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      border: 1px solid transparent;
      transition: border-color 0.15s;
    }

    li:hover { border-color: #333; }

    li.done span {
      text-decoration: line-through;
      color: #666;
    }

    label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      flex: 1;
    }

    input[type="checkbox"] {
      accent-color: #7c3aed;
      width: 1.1rem;
      height: 1.1rem;
    }

    li button {
      background: none;
      border: none;
      color: #666;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0 0.3rem;
      line-height: 1;
    }

    li button:hover { color: #ef4444; }

    .empty {
      text-align: center;
      color: #666;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script type="module">
    const app = document.querySelector('#app');

    async function getTodos() {
      const res = await fetch('/api/todos');
      return res.json();
    }

    async function addTodo(text) {
      const res = await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      return res.json();
    }

    async function toggleTodo(id) {
      const res = await fetch(`/api/todos/${id}/toggle`, { method: 'POST' });
      return res.json();
    }

    async function deleteTodo(id) {
      const res = await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      return res.json();
    }

    function render(todos) {
      app.innerHTML = `
        <h1>Express Fetch Demo</h1>
        <p class="subtitle">
          Each action below calls an Express endpoint via <code>fetch()</code>
          <br>Open the Network tab to see it in action.
        </p>

        <form id="add-form">
          <input type="text" id="new-todo" placeholder="What needs to be done?" autocomplete="off" />
          <button type="submit">Add</button>
        </form>

        <ul id="todo-list">
          ${todos
            .map(
              (todo) => `
            <li class="${todo.done ? 'done' : ''}">
              <label>
                <input type="checkbox" ${todo.done ? 'checked' : ''} data-toggle="${todo.id}" />
                <span>${todo.text}</span>
              </label>
              <button data-delete="${todo.id}" title="Delete">&times;</button>
            </li>
          `
            )
            .join('')}
        </ul>

        ${todos.length === 0 ? '<p class="empty">No todos yet. Add one above!</p>' : ''}

        <button id="form-btn" type="submit">Submit with fetch call</button>
      `;

      // Wire up the add form
      document.querySelector('#add-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.querySelector('#new-todo');
        const text = input.value.trim();
        if (!text) return;

        input.disabled = true;
        const updated = await addTodo(text);
        render(updated);
      });

      // Wire up toggle checkboxes
      document.querySelectorAll('[data-toggle]').forEach((el) => {
        el.addEventListener('change', async () => {
          const id = Number(el.dataset.toggle);
          const updated = await toggleTodo(id);
          render(updated);
        });
      });

      // Wire up form button
      document.querySelector('#form-btn').addEventListener('click', async () => {
        await fetch('/form', { method: 'POST' });
      });

      // Wire up delete buttons
      document.querySelectorAll('[data-delete]').forEach((el) => {
        el.addEventListener('click', async () => {
          const id = Number(el.dataset.delete);
          const updated = await deleteTodo(id);
          render(updated);
        });
      });
    }

    // Initial load
    const todos = await getTodos();
    render(todos);
  </script>
</body>
</html>
